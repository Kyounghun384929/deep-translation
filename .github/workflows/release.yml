name: release
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[release]')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Check release version
        shell: pwsh
        run: |
          $version = ([xml](Get-Content 'DeepTranslation/DeepTranslation.csproj' -Raw -Encoding utf8)).Project.PropertyGroup.Version
          if ($env:GITHUB_REF.StartsWith('refs/tags/') -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and project versions must match.' }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          if (-not (Test-Path "docs/releases/v$version.md")) { throw 'Release notes are missing.' }
      - name: Build with .NET 8 and Inno Setup
        shell: pwsh
        run: ./build.ps1 -Installer
      - name: Validate packaged application
        shell: pwsh
        run: |
          $test = Start-Process dist/DeepTranslation.exe -ArgumentList '--selftest', '--no-llm', '--out', 'dist/self-test.txt' -Wait -PassThru -WindowStyle Hidden
          Get-Content dist/self-test.txt
          if ($test.ExitCode -ne 0) { throw 'Application self-test failed.' }
          $files = @('dist/DeepTranslation.exe', "dist/DeepTranslation-Setup-$env:APP_VERSION.exe")
          Get-FileHash -LiteralPath $files -Algorithm SHA256 | ForEach-Object { '{0}  {1}' -f $_.Hash.ToLowerInvariant(), [IO.Path]::GetFileName($_.Path) } | Set-Content dist/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: DeepTranslation-windows
          path: |
            dist/DeepTranslation.exe
            dist/DeepTranslation-Setup-*.exe
            dist/SHA256SUMS.txt
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:APP_VERSION
          $tag = "v$version"
          & gh release view $tag --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) { Write-Output "Release $tag already exists; leaving it unchanged."; exit 0 }
          $files = @('dist/DeepTranslation.exe', "dist/DeepTranslation-Setup-$version.exe", 'dist/SHA256SUMS.txt')
          $releaseArgs = @('release', 'create', $tag) + $files + @('--target', $env:GITHUB_SHA, '--title', ('Deep Translation ' + $tag), '--notes-file', "docs/releases/$tag.md")

          & gh @releaseArgs
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }